# Flutter i18n 生成設定 (#18)。`flutter gen-l10n`（pub get / build 時も自動）が
# lib/l10n/*.arb から AppLocalizations を生成する。
#
# template-arb-file（app_en.arb）が「正本」で、キーと @meta（プレースホルダ型・
# description）はここに書く。app_ja.arb は同じキーの ja 訳だけを持つ。
#
# 生成物は synthetic package（.dart_tool/flutter_gen/gen_l10n/）に出力され、
# `package:flutter_gen/gen_l10n/app_localizations.dart` で import する。
# .dart_tool は gitignore 済みなので生成物はコミットされない（ARB と本ファイルのみ）。
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
