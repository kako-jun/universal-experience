name: universal_experience
description: Universal accessibility experience simulator for multiple sensory disabilities
publish_to: 'none'
version: 0.1.0+1

environment:
  # flutter_rust_bridge 生成の frb_generated.web.dart が inline-class
  # (extension type) を使うため Dart 3.3+ が必要。
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # i18n (#18). flutter_localizations は GlobalMaterial/Widgets/Cupertino の
  # ローカライズを供給し、intl は flutter gen-l10n が生成する AppLocalizations の
  # ランタイム依存。バージョンは Flutter SDK 同梱版に固定する（pub get が解決）。
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6

  # Platform Integration
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  window_manager: ^0.3.7
  hotkey_manager: ^0.2.3
  tray_manager: ^0.2.1

  # ユーザー画像の読み込み (#78, #97)。ファイル選択（file_selector）・デスクトップへの
  # ドラッグ＆ドロップ（desktop_drop）・クリップボードの画像貼り付け（pasteboard）。
  # 画像は端末の外へ送らず、ディスクにも保存しない（デコードして ui.Image に
  # 変換するだけ）。
  #
  # pasteboard を選んだ理由（#97）: Flutter 標準の Clipboard はテキストしか
  # 扱えない。候補の super_clipboard は super_native_extensions（Rust +
  # cargokit + irondash）を追加でビルドするため、CI・ローカルのビルドが重くなる。
  # pasteboard は macOS/Linux/Windows に対応し、ネイティブ側は各 OS の標準
  # API（NSPasteboard / GtkClipboard）だけで、画像を PNG バイト列で返す。
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  pasteboard: ^0.5.0

  # Rust Bridge (sensus-core 連携: シェーダ取得 + uniform 計算)
  # 別の flutter_rust_bridge プロジェクトと同じ 2.11.1 系を採用（そちらは ^ だが、
  # ここは exact pin）。
  # codegen ツール (2.11.1) と生成物のバージョンスタンプを一致させるため exact pin。
  # （^ にすると 2.12.0 が入り forceSameCodegenVersion で実機初期化に失敗しうる）
  flutter_rust_bridge: 2.11.1
  # FRB 2.11.1 は freezed 2.x 系を前提（3.x prerelease は非互換）。
  freezed_annotation: ^2.4.4
  # cargokit 統合 (#55)。rust_builder/ は flutter_rust_bridge_codegen integrate
  # 相当の手順で追加した FFI plugin で、macOS / Linux ビルド時に rust/ crate を
  # ビルドしアプリへ同梱する。中身は生成物なので直接編集しない。
  universal_experience_rust:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # flutter_rust_bridge_codegen が生成時に要求する。
  ffigen: ^20.1.1
  freezed: ^2.5.7
  build_runner: ^2.4.13
  # 実ブリッジ smoke test (#55)。integration_test/ を `flutter test
  # integration_test -d macos` で実行するために要る。
  integration_test:
    sdk: flutter
  # サンプル画像集の生成ツール（tools/generate_samples.dart、#78）専用。
  # アプリ本体では使わない（ビルド成果物には含まれない）。
  image: ^4.10.1
  # test/image_source_picker_test.dart が XFile（file_selector/desktop_drop の
  # 推移的依存）を直接使うため明示する（#78）。
  cross_file: ^0.3.5+5

flutter:
  uses-material-design: true

  # i18n (#18). flutter gen-l10n が ARB（lib/l10n/*.arb）から AppLocalizations を
  # 生成する。設定は l10n.yaml。生成物（lib/l10n/ 配下、.gitignore 済み）はコミットしない。
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    # タスクトレイアイコン (#15)。tray_manager の setIcon が
    # rootBundle 経由でこのパスを解決する。
    - assets/tray/
    # サンプル画像集 (#78)。自作の手続き生成（tools/generate_samples.dart）。
    # 文字は OFL の Noto Sans / Noto Sans JP（tools/fonts/、#99）で描いている。
    # 出典は assets/samples/README.md。#78: ディレクトリ丸ごと
    # ではなく PNG を個別に列挙する — assets/samples/README.md はアプリの
    # アセットバンドルに含めない（実行時に読まないドキュメントのため）。
    # 新しいサンプルを足したらここにも追加すること
    # （test/sample_catalog_test.dart が rootBundle からのデコードで検知する）。
    - assets/samples/route_map.png
    - assets/samples/chart.png
    - assets/samples/traffic_signs.png
    - assets/samples/info_board.png
    - assets/samples/info_board_ja.png
    - assets/samples/fruit_stand.png
    - assets/samples/night_scene.png
    - assets/samples/depth_landscape.png
    - assets/samples/depth_landscape_depth.png

  # FragmentProgram シェーダ (Impeller サブセットへ手変換した sensus フィルタ)。
  # ビルド時に impellerc がコンパイルする。詳細は docs/sensus-integration.md。
  shaders:
    - shaders/achromatopsia.frag
    - shaders/astigmatism.frag
    - shaders/contrast_sensitivity.frag
    - shaders/deuteranopia.frag
    - shaders/diplopia.frag
    - shaders/eye_strain.frag
    - shaders/hemianopia.frag
    - shaders/hyperopia.frag
    - shaders/macular_degeneration.frag
    - shaders/myopia.frag
    - shaders/nyctalopia.frag
    - shaders/nystagmus.frag
    - shaders/photophobia.frag
    - shaders/presbyopia.frag
    - shaders/protanopia.frag
    - shaders/teichopsia.frag
    - shaders/tetrachromacy.frag
    - shaders/tritanopia.frag
    - shaders/tunnel_vision.frag
    - shaders/vestibular_neuritis.frag

  # Multi-platform support
  # Note: iOS intentionally excluded due to platform restrictions
