name: universal_experience
description: Universal accessibility experience simulator for multiple sensory disabilities
publish_to: 'none'
version: 0.1.0+1

environment:
  # flutter_rust_bridge 生成の frb_generated.web.dart が inline-class
  # (extension type) を使うため Dart 3.3+ が必要。
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Platform Integration
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  window_manager: ^0.3.7
  tray_manager: ^0.2.1

  # Rust Bridge (sensus-core 連携: シェーダ取得 + uniform 計算)
  # selona と同じ 2.11.1 系を採用（selona は ^ だが、ここは exact pin）。
  # codegen ツール (2.11.1) と生成物のバージョンスタンプを一致させるため exact pin。
  # （^ にすると 2.12.0 が入り forceSameCodegenVersion で実機初期化に失敗しうる）
  flutter_rust_bridge: 2.11.1
  # FRB 2.11.1 は freezed 2.x 系を前提（3.x prerelease は非互換）。
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # flutter_rust_bridge_codegen が生成時に要求する。
  ffigen: ^20.1.1
  freezed: ^2.5.7
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # FragmentProgram シェーダ (Impeller サブセットへ手変換した sensus フィルタ)。
  # ビルド時に impellerc がコンパイルする。詳細は docs/sensus-integration.md。
  shaders:
    - shaders/achromatopsia.frag
    - shaders/astigmatism.frag
    - shaders/contrast_sensitivity.frag
    - shaders/deuteranopia.frag
    - shaders/diplopia.frag
    - shaders/eye_strain.frag
    - shaders/hemianopia.frag
    - shaders/hyperopia.frag
    - shaders/macular_degeneration.frag
    - shaders/myopia.frag
    - shaders/nyctalopia.frag
    - shaders/nystagmus.frag
    - shaders/photophobia.frag
    - shaders/presbyopia.frag
    - shaders/protanopia.frag
    - shaders/teichopsia.frag
    - shaders/tetrachromacy.frag
    - shaders/tritanopia.frag
    - shaders/tunnel_vision.frag
    - shaders/vestibular_neuritis.frag

  # Multi-platform support
  # Note: iOS intentionally excluded due to platform restrictions
