[package]
name = "universal_experience_rust"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# flutter_rust_bridge は selona と同一バージョンに固定する（codegen の
# forceSameCodegenVersion 前提）。
flutter_rust_bridge = "=2.11.1"
# 感覚障害シミュレーションのアルゴリズム正本。シェーダ文字列と uniform 計算を
# 提供する（sensus_core::shaders）。GLSL/uniform を ue 内で再実装しないための
# 一元化依存。
sensus-core = "0.5"
# CPU フォールバック (apply_vision_cpu_rgba8) で RgbaImage を組むため。
# sensus-core が使う image 0.25 系に合わせる（DynamicImage の型整合のため）。
image = { version = "0.25", default-features = false }

# golden 参照 PNG の生成・検証テスト（src/golden_gen.rs の #[cfg(test)]）で
# image の PNG codec を使うために png feature を足す。dev-dependencies なので
# 本体 cdylib のビルドには影響しない（テストビルド時のみ有効化）。
# なお PNG codec 自体は sensus-core が通常依存として既に有効化しているため、
# これは feature の明示化であって新規の重量追加ではない。
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
