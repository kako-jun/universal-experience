name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows bundle を実機確認用に取得できるようにする（#149）。
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build windows
        run: flutter build windows --debug

      - name: Verify executable and Rust DLL are bundled
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Debug'
          Get-ChildItem $bundle
          foreach ($file in @('universal_experience.exe', 'universal_experience_rust.dll')) {
            if (!(Test-Path -Path "$bundle/$file" -PathType Leaf)) {
              throw "Missing Windows bundle file: $file"
            }
          }

      - name: Upload Windows debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-experience-windows-x64-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14

  check:
    env:
      # FRB codegen が cargo expand で使う（CI 実績のある版に固定）。
      CARGO_EXPAND_VERSION: 1.0.126
    # Flutter golden テストはゴールデン生成時のプラットフォーム (macOS) と揃える必要が
    # あるため macos-latest。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml の environment.flutter を唯一の SDK 定義にする。
          flutter-version-file: pubspec.yaml
          cache: true

      # cargokit 統合 (#55) により `flutter build macos` が rust/ crate を
      # ビルドして同梱するため、Rust toolchain を Flutter build より前に用意する。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rust/ crate（cargo fmt/clippy/test が直接使う target/）のキャッシュ。
      # cargokit 経由のビルド（flutter build macos）の出力先は実は安定したパス
      # （build_pod.sh が設定する CARGOKIT_TARGET_TEMP_DIR、Flutter の
      # derived-data 配下 build/macos/Build/Intermediates.noindex/
      # Pods.build/Debug/universal_experience_rust.build/... で実行のたびに
      # 変わるわけではない）。ただ現状はそちらをキャッシュ対象に含めていない
      # （linux-build job の cargokit_build マッピングのような対応は今回は
      # 見送り、シンプルさを優先）。crates.io からの依存取得
      # （~/.cargo/registry 等）は rust-cache が常にキャッシュするので、
      # cargokit 側のビルドもそこは恩恵を受ける。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter pub get
        run: flutter pub get

      # FRB codegen のドリフト検証（lib/src/rust/ と rust/src/frb_generated.rs が
      # rust/src/api/ の Rust コードと同期していること）。
      #
      # 以前は `flutter_rust_bridge_codegen generate` が CI でだけログ無しのまま
      # ハングした（#88）。原因は codegen が内部で走らせる build_runner（freezed 用）:
      # CI の新しい Dart SDK が書くコード（dot shorthand）を freezed 2.x が使う
      # analyzer が解釈できず、例外のあと build_runner が終了しなくなる。そのため
      # tools/check_frb_drift.sh は `--no-build-runner` で generate する
      # （`*.freezed.dart` は比較対象外。構造的な不一致は後続の analyze/test が
      # 落とすが、freezed のバージョンだけ上げた stale は検出できない）。
      #
      # cargo-expand と flutter_rust_bridge_codegen はソースビルドに約 4.5 分
      # かかる。Rust cache（Swatinem/rust-cache）は完全ヒット時に保存し直さず、
      # 実測で毎回ビルドになっていた。そこで 2 つのバイナリを actions/cache で
      # 別途保存し、ヒット時は install をスキップする。キーは OS・アーキテクチャと
      # 両ツールの版。保存は install 直後（restore と save を分けている）に行い、
      # 後段のステップが落ちても次回以降に効くようにする。
      - name: Resolve FRB codegen tool versions
        id: frb
        run: |
          # codegen の版は rust/Cargo.toml の `flutter_rust_bridge = "=X.Y.Z"` から
          # 取る（pubspec.yaml の flutter_rust_bridge と揃える版と同一。二重管理しない）。
          version=$(sed -nE 's/^flutter_rust_bridge = "=([0-9.]+)".*/\1/p' rust/Cargo.toml)
          test -n "$version"
          echo "codegen=$version" >> "$GITHUB_OUTPUT"

      - name: Restore FRB codegen tools
        id: frb-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-tools-${{ runner.os }}-${{ runner.arch }}-cargo-expand-${{ env.CARGO_EXPAND_VERSION }}-codegen-${{ steps.frb.outputs.codegen }}

      - name: Install FRB codegen tools
        if: steps.frb-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "${{ steps.frb.outputs.codegen }}" --locked

      - name: Save FRB codegen tools
        if: steps.frb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ steps.frb-cache.outputs.cache-primary-key }}

      - name: Verify FRB codegen has no drift
        timeout-minutes: 15
        run: tools/check_frb_drift.sh

      # shaders/*.frag・pubspec.yaml の shaders: ブロックが tools/sensus_shaders.g.json
      # と同期していることを明示的に確認する（#56）。test/shader_codegen_test.dart
      # も同じ --check を内部で回すが、ドリフトの原因切り分けをしやすくするため
      # 独立ステップとしても実行する。
      - name: Verify shader codegen has no drift
        run: dart run tools/generate_shaders.dart --check

      # lib/rendering/color_matrices.g.dart (Machado severity グリッド) が
      # tools/color_matrices.g.json と同期していることを明示的に確認する（#59）。
      # test/color_matrix_codegen_test.dart も同じ --check を内部で回すが、
      # ドリフトの原因切り分けをしやすくするため独立ステップとしても実行する。
      - name: Verify color matrix codegen has no drift
        run: dart run tools/generate_color_matrices.dart --check

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      # rust 依存は crates.io のみ (sensus-core)。private git 依存が無いので
      # deploy key / ssh-agent 手順は不要。
      - name: Rust fmt check
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: rust
        run: cargo test

      - name: Flutter build macos
        run: flutter build macos --debug

      # 実ブリッジ smoke test (#55)。cargokit が同梱した native lib を使い、
      # experiences() とプリセット欄の描画を確認する（ローカル実測で約25秒、
      # 直前の Flutter build macos で Rust ビルドキャッシュを再利用するため
      # ここでの追加ビルドは短い）。
      #
      # 1 回の `flutter test integration_test` 呼び出しに複数ファイルを渡すと、
      # デスクトップ (macOS/Linux 双方で確認済み) では 2 番目以降のファイルの
      # アプリ起動が "Error waiting for a debug connection: The log reader
      # stopped unexpectedly, or never started." で失敗する。1 個目のアプリ
      # プロセスがきれいに終了しきる前に 2 個目を起動しようとして落ちている
      # とみられる desktop integration_test の既知の制約で、テスト内容の
      # 問題ではない。ファイルごとに別の CLI 呼び出しに分け、各アプリ
      # プロセスが完全に終了してから次を起動させることで回避する
      # （ファイルが増えたら手動で追記する。少数固定なので動的化はしない）。
      - name: Flutter integration test (macos, experience_presets_smoke_test)
        run: flutter test integration_test/experience_presets_smoke_test.dart -d macos

      - name: Flutter integration test (macos, app_bootstrap_test)
        run: flutter test integration_test/app_bootstrap_test.dart -d macos

      # プレビューの正本経路になった CPU apply()（#85）が kVisionFilterCatalog
      # 全 30 種で実ブリッジ経由で例外なく動くことを確認する。
      - name: Flutter integration test (macos, cpu_preview_all_filters_test)
        run: flutter test integration_test/cpu_preview_all_filters_test.dart -d macos

      # urgency/urgency_escalation/recommended_strength（#76/#77）が
      # kVisionFilterCatalog 全 30 種で実ブリッジ経由で sensus-core の値を
      # 一致して返すことを確認する。widget/unit test はフィクスチャ止まりなので
      # ここが実ブリッジとの一致を保証する唯一の場所。
      - name: Flutter integration test (macos, vision_filter_urgency_parity_test)
        run: flutter test integration_test/vision_filter_urgency_parity_test.dart -d macos

  # Linux でも cargokit (#55) が rust/ crate を実際にビルドして同梱することを
  # 検証する。macOS の `check` job は golden テスト用に必須だが、Linux 側の
  # 同梱経路（linux/CMakeLists.txt の apply_cargokit、rpath $ORIGIN/lib）は
  # 別途ここで実証する。
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter Linux デスクトップビルドの標準要件（clang/cmake/ninja/pkg-config/
      # GTK3）に加え、tray_manager が要求する libayatana-appindicator3-dev
      # （無ければ CMake 構成が `tray_manager requires ayatana-appindicator3-0.1
      # or appindicator3-0.1` で FATAL_ERROR になる）と、hotkey_manager (#63)
      # が要求する libkeybinder-3.0-dev（無ければ `hotkey_manager package
      # requires keybinder-3.0` で FATAL_ERROR になる。パッケージ名は
      # hotkey_manager の README では `keybinder-3.0` と案内されているが、
      # Ubuntu では pkg-config の .pc ファイルを含む dev パッケージ名が
      # `libkeybinder-3.0-dev`）。window_manager / screen_retriever は GTK3
      # のみで追加パッケージ不要（各 linux/CMakeLists.txt で確認済み）。
      # xvfb は「実ブリッジ integration test を Linux でヘッドレス実行する」ために
      # 追加（下記 "Flutter integration test (linux)" 参照）。
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml の environment.flutter を唯一の SDK 定義にする。
          flutter-version-file: pubspec.yaml
          cache: true

      # cargokit が rustup を直接呼ぶため、rustup 経由でインストールする
      # dtolnay/rust-toolchain を使う（#55、docs/GETTING_STARTED.md 参照）。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # このジョブは cargo fmt/clippy/test を一切実行しない（それらは `check`
      # job 側の macOS 環境でのみ回す）ので、素の `rust` workspace エントリは
      # 中身の無い rust/target/ をキャッシュするだけで無意味。ここでキャッシュ
      # したいのは cargokit が `flutter build linux` 時に実際にビルドで使う
      # 一時ディレクトリ（CMAKE_CURRENT_BINARY_DIR/cargokit_build、
      # rust_builder/cargokit/cmake/cargokit.cmake 参照）だけで、目的は
      # `flutter build linux` の高速化（cargo の成果物キャッシュではない）。
      # Flutter Linux の標準ビルドパス（build/linux/x64/<config>/plugins/<plugin>）
      # を前提にしており、Flutter のバージョンでこの構造が変わった場合は
      # キャッシュがヒットしないだけで（保存対象が存在しない）ビルド自体は失敗しない。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> ../build/linux/x64/debug/plugins/universal_experience_rust/cargokit_build

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build linux
        run: flutter build linux --debug

      # 完了条件（#55）: Rust ライブラリが実際に Linux バンドルの
      # lib/ に同梱されていることを確認する。ls -la でバンドル内容を可視化した上で、
      # 同じステップ内の test -f が対象ファイルの有無を判定し、無ければこの
      # ステップ自体が fail する。
      - name: Verify Rust library is bundled in the Linux bundle
        run: |
          BUNDLE_LIB=build/linux/x64/debug/bundle/lib
          echo "Contents of $BUNDLE_LIB:"
          ls -la "$BUNDLE_LIB"
          test -f "$BUNDLE_LIB/libuniversal_experience_rust.so"

      # ファイル存在確認（上のステップ）は「同梱されている」ことしか示さず、
      # 実際にロード・初期化できることは証明しない（bad rpath・シンボル欠落等は
      # ここを通過しうる）。実ブリッジ integration test を Linux 上でも走らせて
      # そのギャップを塞ぐ（macOS 側の `check` job の
      # `flutter test integration_test/... -d macos` と対になる）。ヘッドレス
      # 実行のため xvfb-run で仮想ディスプレイを用意する。
      # experience_presets_smoke_test.dart と app_bootstrap_test.dart（#55）の
      # 両方をここで実行する。
      #
      # macOS 側と同じ理由（上のコメント参照）で、1 回の呼び出しに複数ファイルを
      # 渡すと 2 番目のファイルのアプリ起動が同じ症状で失敗する（Linux/xvfb でも
      # 実際に確認済み）ため、ファイルごとに別の xvfb-run 呼び出しに分ける。
      - name: Flutter integration test (linux, experience_presets_smoke_test)
        run: xvfb-run -a flutter test integration_test/experience_presets_smoke_test.dart -d linux

      - name: Flutter integration test (linux, app_bootstrap_test)
        run: xvfb-run -a flutter test integration_test/app_bootstrap_test.dart -d linux

      # プレビューの正本経路になった CPU apply()（#85）が kVisionFilterCatalog
      # 全 30 種で実ブリッジ経由で例外なく動くことを確認する（macOS 側と対）。
      - name: Flutter integration test (linux, cpu_preview_all_filters_test)
        run: xvfb-run -a flutter test integration_test/cpu_preview_all_filters_test.dart -d linux

      # urgency/urgency_escalation/recommended_strength（#76/#77）が実ブリッジ
      # 経由で sensus-core の値と一致することを確認する（macOS 側と対）。
      - name: Flutter integration test (linux, vision_filter_urgency_parity_test)
        run: xvfb-run -a flutter test integration_test/vision_filter_urgency_parity_test.dart -d linux
