name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Flutter golden テストはゴールデン生成時のプラットフォーム (macOS) と揃える必要が
    # あるため macos-latest。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # cargokit 統合 (#55) により `flutter build macos` が rust/ crate を
      # ビルドして同梱するため、Rust toolchain を Flutter build より前に用意する。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # rust/ crate（cargo fmt/clippy/test が直接使う target/）のキャッシュ。
      # cargokit 経由のビルド（flutter build macos）は Xcode の DerivedData 配下に
      # 実行のたびに変わる一時ディレクトリへ出力するため、そちらはキャッシュ対象に
      # 含めていない（安定したパスがない）。crates.io からの依存取得
      # （~/.cargo/registry 等）は rust-cache が常にキャッシュするので、
      # cargokit 側のビルドもそこは恩恵を受ける。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      # rust 依存は crates.io のみ (sensus-core)。private git 依存が無いので
      # deploy key / ssh-agent 手順は不要。
      - name: Rust fmt check
        working-directory: rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: rust
        run: cargo test

      - name: Flutter build macos
        run: flutter build macos --debug

      # 実ブリッジ smoke test (#55)。cargokit が同梱した native lib を使い、
      # experiences() とプリセット欄の描画を確認する（ローカル実測で約25秒、
      # 直前の Flutter build macos で Rust ビルドキャッシュを再利用するため
      # ここでの追加ビルドは短い）。
      - name: Flutter integration test (macos)
        run: flutter test integration_test -d macos

  # Linux でも cargokit (#55) が rust/ crate を実際にビルドして同梱することを
  # 検証する。macOS の `check` job は golden テスト用に必須だが、Linux 側の
  # 同梱経路（linux/CMakeLists.txt の apply_cargokit、rpath $ORIGIN/lib）は
  # 別途ここで実証する。
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter Linux デスクトップビルドの標準要件（clang/cmake/ninja/pkg-config/
      # GTK3）に加え、tray_manager が要求する libayatana-appindicator3-dev
      # （無ければ CMake 構成が `tray_manager requires ayatana-appindicator3-0.1
      # or appindicator3-0.1` で FATAL_ERROR になる）。window_manager /
      # screen_retriever は GTK3 のみで追加パッケージ不要（各 linux/CMakeLists.txt
      # で確認済み）。
      # xvfb は「実ブリッジ integration test を Linux でヘッドレス実行する」ために
      # 追加（下記 "Flutter integration test (linux)" 参照）。
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # cargokit が rustup を直接呼ぶため、rustup 経由でインストールする
      # dtolnay/rust-toolchain を使う（#55、docs/GETTING_STARTED.md 参照）。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # このジョブは cargo fmt/clippy/test を一切実行しない（それらは `check`
      # job 側の macOS 環境でのみ回す）ので、素の `rust` workspace エントリは
      # 中身の無い rust/target/ をキャッシュするだけで無意味。ここでキャッシュ
      # したいのは cargokit が `flutter build linux` 時に実際にビルドで使う
      # 一時ディレクトリ（CMAKE_CURRENT_BINARY_DIR/cargokit_build、
      # rust_builder/cargokit/cmake/cargokit.cmake 参照）だけで、目的は
      # `flutter build linux` の高速化（cargo の成果物キャッシュではない）。
      # Flutter Linux の標準ビルドパス（build/linux/x64/<config>/plugins/<plugin>）
      # を前提にしており、Flutter のバージョンでこの構造が変わった場合は
      # キャッシュがヒットしないだけで（保存対象が存在しない）ビルド自体は失敗しない。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> ../build/linux/x64/debug/plugins/universal_experience_rust/cargokit_build

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build linux
        run: flutter build linux --debug

      # 完了条件（#55 レビュー指摘）: Rust ライブラリが実際に Linux バンドルの
      # lib/ に同梱されていることを ls で確認する。無ければ次のステップで fail。
      - name: Verify Rust library is bundled in the Linux bundle
        run: |
          BUNDLE_LIB=build/linux/x64/debug/bundle/lib
          echo "Contents of $BUNDLE_LIB:"
          ls -la "$BUNDLE_LIB"
          test -f "$BUNDLE_LIB/libuniversal_experience_rust.so"

      # ファイル存在確認（上のステップ）は「同梱されている」ことしか示さず、
      # 実際にロード・初期化できることは証明しない（bad rpath・シンボル欠落等は
      # ここを通過しうる）。実ブリッジ integration test を Linux 上でも走らせて
      # そのギャップを塞ぐ（macOS 側の `check` job の
      # `flutter test integration_test -d macos` と対になる）。ヘッドレス実行
      # のため xvfb-run で仮想ディスプレイを用意する。
      # experience_presets_smoke_test.dart と app_bootstrap_test.dart（#55）の
      # 両方がここで実行される。
      - name: Flutter integration test (linux)
        run: xvfb-run -a flutter test integration_test -d linux
