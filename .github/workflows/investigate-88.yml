# 使い捨て調査 workflow (#88)。最終 PR では削除する。
name: investigate-88
on:
  push:
    branches: [88-frb-codegen-hang]

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [A-baseline, B-no-build-runner, C-prerun-build-runner, D-minimal]
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: debug
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Versions
        run: |
          flutter --version
          dart --version
          rustc --version
          sw_vers
      - run: flutter pub get
      - name: Install codegen tools (separate step)
        run: |
          cargo install cargo-expand --locked
          cargo install flutter_rust_bridge_codegen --version 2.11.1 --locked
          cargo expand --version
      - name: C pre-run build_runner
        if: matrix.variant == 'C-prerun-build-runner'
        run: |
          tools/investigate_88_watch.sh 240 flutter pub run build_runner build --delete-conflicting-outputs --enable-experiment=class-modifiers
      - name: Codegen
        run: |
          case "${{ matrix.variant }}" in
            A-baseline) args="" ;;
            B-no-build-runner) args="--no-build-runner" ;;
            C-prerun-build-runner) args="--no-build-runner" ;;
            D-minimal) args="--no-build-runner --no-dart-fix --no-dart-format" ;;
          esac
          echo "args=$args"
          tools/investigate_88_watch.sh 300 flutter_rust_bridge_codegen --verbose generate $args
      - name: Drift check (informational)
        if: always()
        run: git status --short && git diff --stat
